:root{--bg:#f6f7fb;--card:#fff;--ink:#1f2430;--muted:#5d6475;--line:#e3e6ee;--or:#ff8c1a;--bl:#4c97ff;--gr:#2e9e5b;--grl:#e6f5ec;--rd:#d93a2b;--rdl:#fdecea;--radius:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.hero{background:linear-gradient(135deg,#d93a2b 0%,#ff8c1a 55%,#ffbf00 100%);color:#fff;padding:32px 0 26px}
.hero .kicker{text-transform:uppercase;letter-spacing:3px;font-size:13px;font-weight:700;opacity:.92}
.hero h1{margin:4px 0 0;font-size:clamp(28px,5vw,42px)}
.hero p{margin:8px 0 0;max-width:660px;opacity:.96}
.bar{background:#fff;border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-direction:column;gap:8px;padding-top:12px;padding-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);width:70px;flex:none}
.chip{font:inherit;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.area.on{background:var(--c);border-color:var(--c)}
.stars{color:var(--or);letter-spacing:1px}
.chip.on .stars{color:#fff}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:2px}
.btn{font:inherit;font-weight:700;padding:9px 16px;border-radius:10px;border:0;background:var(--bl);color:#fff;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.prog{font-size:14px;color:var(--muted);margin-left:auto}
.prog b{color:var(--gr)}
main{padding:22px 0 40px}
.intro{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px}
.intro h2{margin:0 0 6px;font-size:19px}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.types div{background:#f1f3f8;border-radius:10px;padding:8px 12px;font-size:14px}
.types b{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;position:relative}
.tile:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
.tile .no{font-weight:800;font-size:18px}
.tile .meta{font-size:13px;color:var(--muted)}
.tile .ty{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;background:#f1f3f8;border-radius:999px;padding:2px 9px}
.tile.done::after{content:"✓";position:absolute;right:12px;top:8px;font-weight:800;font-size:22px;color:var(--gr)}
.empty{color:var(--muted)}
.task{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.thead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 18px;background:var(--c);color:#fff}
.thead h2{margin:0;font-size:21px}
.thead .tag{background:rgba(255,255,255,.25);padding:3px 10px;border-radius:999px;font-weight:700;font-size:13px}
.thead .stars{color:#fff;margin-left:auto}
.goal{padding:12px 18px;background:#fff8e6;border-bottom:1px solid var(--line)}
.goal b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.code{padding:14px 18px;display:flex;flex-wrap:wrap;gap:14px}
figure{margin:0;padding:10px 12px;border:1px dashed #cfd5e2;border-radius:12px;max-width:100%}
figcaption{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.blk{overflow-x:auto;max-width:100%}
.blk svg{display:block;max-width:100%;height:auto}
figure{min-width:0}
.clickable g[data-b]{cursor:pointer}
g.hov>path{stroke:#1f2430;stroke-width:2.5px}
g.bad>path{stroke:var(--rd);stroke-width:4px}
g.good>path{stroke:#11823b;stroke-width:5px}
.q{padding:4px 18px 4px;font-weight:700;font-size:17px}
.opts{padding:8px 18px 4px;display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--bl)}
.opt.wrong{border-color:var(--rd);background:var(--rdl)}
.opt.right{border-color:var(--gr);background:var(--grl);font-weight:700}
.opt:disabled{cursor:default}
.fb{margin:10px 18px;padding:10px 14px;border-radius:12px;font-weight:600}
.fb.no{background:var(--rdl);color:#8c1d12}
.fb.yes{background:var(--grl);color:#14532d}
.sol{margin:6px 18px 16px;padding:12px 14px;border-radius:12px;background:#eef5ff;border:1px solid #cfe0ff}
.sol h3{margin:0 0 6px;font-size:16px}
.sol .code{padding:10px 0 0}
.nav{display:flex;gap:10px;flex-wrap:wrap;padding:0 18px 18px}
.tip{font-size:14px;color:var(--muted);margin:8px 0 0}
footer{color:var(--muted);font-size:13px;padding:10px 16px 40px;text-align:center}
footer a{color:var(--bl)}

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function md(s){return esc(s).replace(/„([^“]+)“/g,'„<b>$1</b>“');}
function list(){ return TASKS.filter(t => (S.area==='all'||t.area===S.area) && (!S.level||t.level===S.level)); }

function bar(){
  const a = $('#areas'); a.querySelectorAll('.chip').forEach(c=>c.remove());
  [{key:'all',name:'Alle',color:'#1f2430'}].concat(AREAS).forEach(x=>{
    const b=document.createElement('button'); b.className='chip area'+(S.area===x.key?' on':''); b.style.setProperty('--c',x.color);
    b.textContent=x.name; b.onclick=()=>{S.area=x.key; S.view=null; render();}; a.appendChild(b);});
  const l = $('#levels'); l.querySelectorAll('.chip').forEach(c=>c.remove());
  [[0,'Alle'],[1,'★'],[2,'★★'],[3,'★★★']].forEach(([n,t])=>{
    const b=document.createElement('button'); b.className='chip'+(S.level===n?' on':'');
    b.innerHTML = n? '<span class="stars">'+t+'</span>' : t; b.onclick=()=>{S.level=n; S.view=null; render();}; l.appendChild(b);});
  const n = Object.keys(done).length;
  $('#prog').innerHTML = 'Gelöst: <b>'+n+'</b> von '+TASKS.length;
}
function overview(){
  const L = list();
  let h = '<div class="intro"><h2>So geht’s</h2>Wähle eine Aufgabe. Lies zuerst, was der Code tun <b>soll</b>. Dann suchst du den Fehler. Es gibt drei Aufgabenarten:'+
    '<div class="types"><div><b>Finde den Block</b>Klicke auf den Block, der falsch ist.</div><div><b>Was ist der Fehler?</b>Wähle die richtige Erklärung.</div><div><b>Was passiert?</b>Sag vorher, was das Programm macht.</div></div>'+
    '<p class="tip">Profi-Tipp: Baue den reparierten Code danach in Scratch nach und teste ihn.</p></div>';
  if(!L.length) h += '<p class="empty">Keine Aufgaben für diese Auswahl.</p>';
  h += '<div class="grid">' + L.map(t=>{const a=areaOf(t.area);
    return '<button class="tile'+(done[t.id]?' done':'')+'" style="--c:'+a.color+'" data-id="'+t.id+'"><div class="no">Aufgabe '+t.id+'</div><div class="meta">'+a.name+' · <span class="stars">'+stars(t.level)+'</span></div><span class="ty">'+TYPES[t.type]+'</span></button>';}).join('') + '</div>';
  $('#main').innerHTML = h;
  $('#main').querySelectorAll('.tile').forEach(b=>b.onclick=()=>openTask(+b.dataset.id));
}
function figs(arr, cls){ return '<div class="code">'+arr.map(c=>'<figure><figcaption>'+esc(c.fig)+'</figcaption><div class="blk '+(cls||'')+'">'+c.svg+'</div></figure>').join('')+'</div>'; }
function openTask(id){ S.view=id; try{history.replaceState(null,'','#a'+id);}catch(e){} render(); window.scrollTo({top:document.querySelector('.bar').offsetTop}); }
function taskView(t){
  const a = areaOf(t.area); let tries = 0, solved = false;
  let h = '<div class="task" style="--c:'+a.color+'"><div class="thead"><span class="tag">Aufgabe '+t.id+'</span><h2>'+TYPES[t.type]+'</h2><span class="tag">'+a.name+'</span><span class="stars">'+stars(t.level)+'</span></div>'+
    '<div class="goal"><b>So soll es sein</b>'+md(t.goal)+'</div>' + figs(t.code, t.type==='click'?'clickable':'') +
    '<div class="q">'+md(t.question)+'</div>';
  if (t.type!=='click') h += '<div class="opts">'+t.options.map((o,i)=>'<button class="opt" data-i="'+i+'">'+md(o)+'</button>').join('')+'</div>';
  h += '<div id="fb"></div><div id="sol"></div><div class="nav"><button class="btn ghost" id="back">← Übersicht</button><button class="btn ghost" id="show">Lösung anzeigen</button><button class="btn" id="next">Nächste Aufgabe →</button></div></div>';
  $('#main').innerHTML = h;
  const fb = $('#fb'), sol = $('#sol'), show = $('#show');
  show.style.display='none';
  function feedback(ok, msg){ fb.innerHTML = '<div class="fb '+(ok?'yes':'no')+'">'+msg+'</div>'; }
  function reveal(byUser){
    solved = true; show.style.display='none';
    if(!byUser){ done[t.id]=1; save(); bar(); }
    sol.innerHTML = '<div class="sol"><h3>Das ist der Fehler</h3>'+md(t.explain)+'<h3 style="margin-top:12px">So ist es richtig</h3>'+figs(t.fix)+'<p class="tip">Baue den reparierten Code in Scratch nach und probiere ihn aus.</p></div>';
    if(t.type==='click'){ const g=$('.clickable g[data-b="'+t.target+'"]'); if(g){ g.classList.remove('bad'); g.classList.add('good'); } }
    else { $('.opts').querySelectorAll('.opt').forEach((b,i)=>{ b.disabled=true; if(i===t.correct) b.classList.add('right'); }); }
  }
  function wrong(){ tries++; if(tries>=2) show.style.display=''; }
  if (t.type==='click'){
    const box = $('.clickable'); let hov=null;
    box.addEventListener('mousemove', e=>{ const g=e.target.closest('g[data-b]'); if(hov&&hov!==g) hov.classList.remove('hov'); if(g&&!solved){ g.classList.add('hov'); hov=g; } });
    box.addEventListener('mouseleave', ()=>{ if(hov) hov.classList.remove('hov'); });
    box.addEventListener('click', e=>{ if(solved) return; const g=e.target.closest('g[data-b]'); if(!g) return;
      box.querySelectorAll('g.bad').forEach(x=>x.classList.remove('bad'));
      if(+g.dataset.b===t.target){ feedback(true,'Richtig! Diesen Block hast du gut erwischt.'); reveal(false); }
      else { g.classList.add('bad'); const f=g.closest('figure'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
        feedback(false,'Dieser Block ist in Ordnung. Lies noch einmal genau, was passieren soll.'); wrong(); } });
  } else {
    $('.opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(solved) return; const i=+b.dataset.i;
      if(i===t.correct){ b.classList.add('right'); feedback(true,'Richtig!'); reveal(false); }
      else { b.classList.add('wrong'); b.disabled=true; feedback(false,'Noch nicht richtig – versuche es noch einmal.'); wrong(); } });
  }
  show.onclick=()=>{ feedback(false,'Hier ist die Lösung. Versuche danach eine andere Aufgabe selbst.'); reveal(true); };
  $('#back').onclick=()=>{ S.view=null; try{history.replaceState(null,'','#');}catch(e){} render(); };
  $('#next').onclick=()=>{ const L=list(); const k=L.findIndex(x=>x.id===t.id); const n=L[(k+1)%L.length]||TASKS[0]; openTask(n.id); };
}
function render(){ bar(); if(S.view){ taskView(TASKS.find(t=>t.id===S.view)); } else overview(); }
$('#rnd').onclick=()=>{ const L=list().filter(t=>!done[t.id]); const P=L.length?L:list(); if(!P.length) return; openTask(P[Math.floor(Math.random()*P.length)].id); };
const m=(location.hash||'').match(/^#a(\d+)$/); if(m && TASKS.find(t=>t.id===+m[1])) S.view=+m[1];
render();
</script></body></html>
